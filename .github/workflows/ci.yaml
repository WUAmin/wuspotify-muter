name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test-and-build:
    name: Test and Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package release archives & Universal binary
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist/arm64 dist/x86_64 dist/universal dist/release_assets

          # Copy individual architecture binaries
          cp target/aarch64-apple-darwin/release/wuspotify-muter dist/arm64/
          cp target/x86_64-apple-darwin/release/wuspotify-muter dist/x86_64/

          # Combine into a Universal macOS binary via lipo
          lipo -create \
            -output dist/universal/wuspotify-muter \
            dist/arm64/wuspotify-muter \
            dist/x86_64/wuspotify-muter

          # Create tar.gz archives
          tar -czf "dist/release_assets/wuspotify-muter-latest-macos-arm64.tar.gz" -C dist/arm64 wuspotify-muter
          tar -czf "dist/release_assets/wuspotify-muter-latest-macos-x86_64.tar.gz" -C dist/x86_64 wuspotify-muter
          tar -czf "dist/release_assets/wuspotify-muter-latest-macos-universal.tar.gz" -C dist/universal wuspotify-muter

          # Generate SHA256 checksums
          cd dist/release_assets
          for file in *.tar.gz; do
            shasum -a 256 "$file" > "${file}.sha256"
          done
          shasum -a 256 *.tar.gz > SHA256SUMS.txt

          # Render release description
          cd ../..
          sed "s/TAG_NAME/latest/g" .github/RELEASE_TEMPLATE.md > dist/release_body.md

      - name: Upload latest build artifact
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wuspotify-muter-macos-latest
          path: |
            dist/release_assets/*
          retention-days: 30

      - name: Publish / Update 'latest' Pre-Release
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (main)
          target_commitish: ${{ github.sha }}
          body_path: dist/release_body.md
          files: dist/release_assets/*
          prerelease: true
          make_latest: false
          generate_release_notes: true
